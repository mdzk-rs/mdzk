name: Nix build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Install Nix magic cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build
        run: nix build
